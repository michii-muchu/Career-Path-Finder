<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>start page</title>
    <style>
        *{
            margin: 0;
        }
        body{
            height: 100vh;
            position: relative;
            background-image: url(./assests/bg.jpg);
            background-size:cover;
            background-repeat: repeat-x;
            animation: bgMove  85s linear infinite;
        }
        @keyframes bgMove{
            from{
                background-position: 0 0;
            }
            to{
                background-position: 1000px 0;
            }
        }
        .overlay{
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: rgba(239, 239, 240, 0.85);
            width: 100%;
            height: 100%;
        }
        h2{
            display: grid;
            flex-direction: column;
            padding-top: 20%;
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 35px;
            font-weight: 500;
            word-spacing: 4px;
        }
        button {
            padding: 5px;
            margin: 35px;
            width: 20%;
            background-color: black;
            color: white;
            border-radius: 7px;
        }
        button a{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            background-color: black;
            color: white;
            text-decoration-line: none;
        }
        button:hover{
            box-shadow: 7px 8px 4px rgba(0,0,0,0.1);
            cursor: pointer;
        }

    </style>
</head>
<body>
    <div class="overlay">
        <h2>Welcome to Career Path Finder</h2>
        <button><a href="./homepage.html">Get Started</a></button>
    </div>
</body>
</html>
